services:
  db:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_USER: icc
      POSTGRES_PASSWORD: icc
      POSTGRES_DB: icc
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U icc -d icc"]
      interval: 5s
      timeout: 5s
      retries: 5

  app:
    build:
      context: .
      dockerfile: Dockerfile
    command: node dist/server.js
    restart: unless-stopped
    ports:
      - "3000:3000"
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - data:/data
    env_file: .env

  worker:
    build:
      context: .
      dockerfile: Dockerfile
    command: node dist/worker.js
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - data:/data
    env_file: .env

  ollama:
    image: ollama/ollama
    restart: unless-stopped
    ports:
      - "11434:11434"
    volumes:
      - ollama:/root/.ollama

  backup:
    image: postgres:16
    restart: unless-stopped
    command: /bin/sh /backup.sh
    volumes:
      - backups:/backups
      - data:/data:ro
      - ./backup.sh:/backup.sh:ro
    environment:
      POSTGRES_HOST: db
      POSTGRES_USER: icc
      POSTGRES_PASSWORD: icc
      POSTGRES_DB: icc
    depends_on:
      db:
        condition: service_healthy

volumes:
  pgdata:
  data:
  ollama:
  backups:
